<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Add to JAVP</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, sans-serif; background: #0b0d10; color: #e8eaed;
    }
    main { max-width: 28rem; padding: 2rem; text-align: center; }
    h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
    p { color: #9aa0a6; line-height: 1.45; }
    .actions { display: flex; flex-direction: column; gap: 0.75rem; margin-top: 1.5rem; }
    a.btn {
      display: block; padding: 0.85rem 1rem; border-radius: 10px;
      text-decoration: none; font-weight: 600;
    }
    a.primary { background: #3b82f6; color: #fff; }
    a.secondary { background: #1f2937; color: #e8eaed; }
  </style>
</head>
<body>
  <main>
    <h1>Add this source to JAVP</h1>
    <p>Open the native app if it’s installed, or continue in the web companion.</p>
    <div class="actions">
      <a class="btn primary" id="open-app" href="https://javp.app/">Open in JAVP</a>
      <a class="btn secondary" id="open-web" href="https://web.javp.app/">Open in web app</a>
      <a class="btn secondary" href="https://updater.javp.app/">Download the app</a>
    </div>
  </main>
  <script>
    (function () {
      var q = window.location.search || '';
      document.getElementById('open-app').href = 'https://javp.app/add' + q;
      document.getElementById('open-web').href = 'https://web.javp.app/add' + q;
    })();
  </script>
</body>
</html>
