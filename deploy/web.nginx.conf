# Flutter web companion — nginx snippet for path-URL SPA + cache headers.
#
# Include inside the `server { ... }` block that serves web.javp.app, after
# `root` / `index` are set. Example (path = your docroot after FTP deploy):
#
#   server {
#     listen 443 ssl http2;
#     server_name web.javp.app;
#     root /var/www/web.javp.app;
#     index index.html;
#
#     include /var/www/web.javp.app/web.nginx.conf;
#   }
#
# Equivalent of deploy/web.htaccess (Apache). Also uploaded to the web docroot
# as web.nginx.conf by tool/deploy_web.py so the origin can:
#   include /path/to/docroot/web.nginx.conf;

# Do not list directories.
autoindex off;

# Allow Google Identity Services popups to talk back to this window.
# (same-origin would break Drive scope grant; omit = fine, but this is explicit.)
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

# HTML — always revalidate (entry shell + any static pages).
location ~* \.html$ {
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    try_files $uri =404;
}

# Hashed Flutter entrypoints — long-cache (content-addressed filenames).
location ~* ^/main\.[A-Za-z0-9]+\.dart\.js$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

location ~* ^/flutter_bootstrap\.[A-Za-z0-9]+\.js$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# Unversioned bootstrap / service worker — must not stick across deploys.
location = /main.dart.js {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri =404;
}

location = /flutter_bootstrap.js {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri =404;
}

location = /flutter.js {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri =404;
}

location = /flutter_service_worker.js {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri =404;
}

# GoRouter path URLs (/home, /sources, /add, …) → index.html when no file.
location / {
    try_files $uri $uri/ /index.html;
}
