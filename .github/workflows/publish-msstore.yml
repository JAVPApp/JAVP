name: Publish to Microsoft Store

# Builds a Store MSIX (JAVP_DISTRIBUTION=msstore) and, when Partner Center
# Azure AD secrets are set, submits it with the msstore CLI — same idea as
# WinGet auto-submit after a GitHub Release.
#
# First listing (age ratings, screenshots, description) stays manual in
# Partner Center. After the app is live, this workflow owns package updates.
#
# Secrets (Settings → Secrets → Actions):
#   AZURE_AD_TENANT_ID
#   AZURE_AD_APPLICATION_CLIENT_ID
#   AZURE_AD_APPLICATION_SECRET
#   SELLER_ID
#
# Soft-skip when secrets are missing (attach MSIX to the Release instead).
# Docs: docs/microsoft-store.md

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach/publish from (e.g. v0.4.2). Empty = this ref.
        required: false
        type: string
      submit:
        description: Submit to Partner Center when secrets exist
        type: boolean
        required: false
        default: true
  # Prefer Deploy update's msstore job (waits for Release assets). This
  # release trigger is a fallback / retry path.
  release:
    types: [published]

concurrency:
  group: publish-msstore-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  STORE_PRODUCT_ID: 9P4PMM405RZH

jobs:
  msstore:
    name: Build + submit Store MSIX
    runs-on: windows-latest
    # On release events, Deploy update also runs an msstore job. Skip the
    # racing release trigger; use workflow_dispatch for retries.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      HAVE_CREDS: ${{ secrets.AZURE_AD_TENANT_ID != '' && secrets.SELLER_ID != '' && secrets.AZURE_AD_APPLICATION_CLIENT_ID != '' && secrets.AZURE_AD_APPLICATION_SECRET != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Sync localization ARBs
        run: python tool/l10n/generate_arbs.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # SDK cache is multi-GB and blows the 0.5 GB Actions storage quota.
          # Pub-only is ~100–120 MB per OS and saves most of flutter pub get.
          cache: false
          pub-cache: true

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci

      - name: Resolve dependencies
        run: flutter pub get

      # media_kit's CMake downloads once without retries; prefetch like Deploy update.
      - name: Prefetch Windows media libraries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $destination = "build\windows\x64"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          $archives = @(
            @{
              Name = "mpv-dev-x86_64-20230924-git-652a1dd.7z"
              Url = "https://github.com/media-kit/libmpv-win32-video-build/releases/download/2023-09-24/mpv-dev-x86_64-20230924-git-652a1dd.7z"
              Md5 = "a832ef24b3a6ff97cd2560b5b9d04cd8"
            },
            @{
              Name = "ANGLE.7z"
              Url = "https://github.com/alexmercerind/flutter-windows-ANGLE-OpenGL-ES/releases/download/v1.0.1/ANGLE.7z"
              Md5 = "e866f13e8d552348058afaafe869b1ed"
            }
          )
          foreach ($archive in $archives) {
            $path = Join-Path $destination $archive.Name
            $temporary = "$path.download"
            Remove-Item -Force -ErrorAction SilentlyContinue $path, $temporary
            & curl.exe --fail --location --retry 5 --retry-all-errors `
              --connect-timeout 20 --output $temporary $archive.Url
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to download $($archive.Name)"
            }
            $actual = (Get-FileHash -Algorithm MD5 $temporary).Hash.ToLowerInvariant()
            if ($actual -ne $archive.Md5) {
              throw "$($archive.Name) checksum mismatch: $actual"
            }
            Move-Item -Force $temporary $path
          }

      - name: Sync msix_version from pubspec version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $text = Get-Content -Raw pubspec.yaml
          if ($text -notmatch '(?m)^version:\s*([0-9]+)\.([0-9]+)\.([0-9]+)\+(\d+)') {
            throw "Could not parse version: from pubspec.yaml"
          }
          # Store requires revision (4th) == 0. Main/stable bumps Z, so use
          # X.Y.Z.0 (not +N). First Store upload used 0.5.65.0 as a one-off.
          $msix = "$($Matches[1]).$($Matches[2]).$($Matches[3]).0"
          if ($text -notmatch '(?m)^(\s*msix_version:\s*).+$') {
            throw "msix_version missing under msix_config"
          }
          $updated = [regex]::Replace($text, '(?m)^(\s*msix_version:\s*).+$', "`${1}$msix")
          Set-Content -Path pubspec.yaml -Value $updated -NoNewline
          Write-Host "msix_version=$msix"
          "MSIX_VERSION=$msix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Store MSIX
        shell: pwsh
        run: powershell -File tool/build_msix.ps1

      - name: Locate MSIX package
        id: pack
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $candidates = @(
            Get-ChildItem -Path build -Recurse -Include *.msix,*.msixupload -ErrorAction SilentlyContinue
          ) | Sort-Object LastWriteTime -Descending
          if (-not $candidates) { throw "No .msix / .msixupload under build/" }
          $pkg = $candidates[0].FullName
          Write-Host "Package: $pkg ($([math]::Round($candidates[0].Length/1MB, 2)) MB)"
          "msix=$pkg" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "msix_name=$($candidates[0].Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: javp-msstore-msix
          path: ${{ steps.pack.outputs.msix }}
          if-no-files-found: error
          retention-days: 30

      - name: Attach MSIX to GitHub Release
        if: ${{ inputs.tag != '' || github.event_name == 'release' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
          PKG: ${{ steps.pack.outputs.msix }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAG)) {
            Write-Host "No release tag — skip attach"
            exit 0
          }
          gh release upload $env:TAG $env:PKG --clobber --repo $env:GITHUB_REPOSITORY

      - name: Configure Microsoft Store CLI
        if: ${{ env.HAVE_CREDS == 'true' && inputs.submit }}
        uses: microsoft/microsoft-store-apppublisher@v1.2

      - name: Submit package to Partner Center
        if: ${{ env.HAVE_CREDS == 'true' && inputs.submit }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          msstore reconfigure `
            --tenantId ${{ secrets.AZURE_AD_TENANT_ID }} `
            --sellerId ${{ secrets.SELLER_ID }} `
            --clientId ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }} `
            --clientSecret ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          msstore publish "${{ steps.pack.outputs.msix }}" -id $env:STORE_PRODUCT_ID

      - name: Manual-upload reminder (no submission secrets)
        if: ${{ env.HAVE_CREDS != 'true' }}
        shell: pwsh
        run: |
          Write-Host "::warning::AZURE_AD_* / SELLER_ID secrets not set — MSIX built and uploaded as artifact only."
          Write-Host "Upload ${{ steps.pack.outputs.msix_name }} in Partner Center → Packages, or add the four secrets (see docs/microsoft-store.md)."
          Write-Host "Seller ID for this account: 95689130"
