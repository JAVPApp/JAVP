import java.io.File
import java.nio.file.Files
import java.security.MessageDigest

group 'com.alexmercerind.media_kit_libs_android_video'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    // Conditional for compatibility with AGP <4.2.
    if (project.android.hasProperty("namespace")) {
        namespace 'com.alexmercerind.media_kit_libs_android_video'
    }

    compileSdkVersion 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 16
    }

    dependencies {
        implementation fileTree(dir: "$buildDir/output", include: "*.jar")
    }
}

// Runs an external command without Gradle's exec APIs (this file downloads at
// configuration time, where those APIs are deprecated).
def runCommand = { List<String> command ->
    try {
        def process = new ProcessBuilder(command).redirectErrorStream(true).start()
        def output = process.inputStream.getText("UTF-8")
        process.waitFor()
        return ["exitCode": process.exitValue(), "output": output]
    } catch (IOException e) {
        return ["exitCode": -1, "output": e.message]
    }
}

def commandAvailable = { String binary ->
    runCommand([binary, "--version"]).exitCode == 0
}

def md5Of = { File f ->
    MessageDigest.getInstance("MD5").digest(Files.readAllBytes(f.toPath())).encodeHex().toString()
}

// The jars live on GitHub release storage. The JDK trust store on CI hosts
// intermittently rejects that endpoint ("certificate_unknown / PKIX path
// building failed"), which aborts project evaluation. curl and wget use the
// system trust store, so prefer them and keep the JVM download as a fallback
// for machines that have neither.
def downloaders = []
if (commandAvailable("curl")) {
    downloaders << ["name": "curl", "download": { String url, File dest ->
        def result = runCommand(["curl", "-fSL", "--retry", "3", "--retry-delay", "2",
                                 "--connect-timeout", "30", "--output", dest.absolutePath, url])
        if (result.exitCode != 0) {
            throw new GradleException("curl exited ${result.exitCode}: ${result.output?.trim()}")
        }
    }]
}
if (commandAvailable("wget")) {
    downloaders << ["name": "wget", "download": { String url, File dest ->
        def result = runCommand(["wget", "--tries=3", "--timeout=30", "-O", dest.absolutePath, url])
        if (result.exitCode != 0) {
            throw new GradleException("wget exited ${result.exitCode}: ${result.output?.trim()}")
        }
    }]
}
downloaders << ["name": "jvm", "download": { String url, File dest ->
    def connection = new URL(url).openConnection()
    connection.connectTimeout = 30000
    connection.readTimeout = 300000
    connection.inputStream.withStream { input ->
        dest.withOutputStream { os -> os << input }
    }
}]

// Downloads to a .part file so an interrupted transfer can never be mistaken
// for a complete jar, then verifies the checksum before publishing it. Attempts
// cycle through the available downloaders; the jars are ~60MB each, so the
// budget stays small.
def downloadVerified = { String url, File destination, String expectedMd5 ->
    def partial = new File(destination.parentFile, "${destination.name}.part")
    def failures = []
    def maxAttempts = 4

    for (int attempt = 0; attempt < maxAttempts && !destination.exists(); attempt++) {
        def downloader = downloaders[attempt % downloaders.size()]
        if (attempt > 0) {
            Thread.sleep(2000L * attempt)
        }
        try {
            partial.delete()
            downloader.download(url, partial)
            def actualMd5 = md5Of(partial)
            if (actualMd5 != expectedMd5) {
                throw new GradleException("MD5 mismatch (expected ${expectedMd5}, got ${actualMd5})")
            }
            Files.move(partial.toPath(), destination.toPath())
        } catch (Exception e) {
            failures << "attempt ${attempt + 1} via ${downloader.name}: ${e.message}"
            println "media_kit_libs_android_video: download failed (${downloader.name}) — ${e.message}"
        }
    }

    partial.delete()
    if (!destination.exists()) {
        throw new GradleException("Failed to download ${url}\n  ${failures.join('\n  ')}")
    }
}

task downloadDependencies(type: Exec) {   
        // Delete previously created /output subdirectory.

        def outputDir = file("$buildDir/output")
        if (outputDir.exists()) {
            outputDir.deleteDir()
        }
        outputDir.mkdirs()

        // JAVP override: use media-kit "full" libs (all FFmpeg decoders/demuxers/parsers)
        // instead of the size-optimized "default" flavor. See:
        // https://github.com/media-kit/libmpv-android-video-build
        //
        // Limit ABIs with -PmediaKitAndroidAbis=arm64-v8a (Dev CI fast path).
        // 32-bit x86 is omitted: Flutter dropped the android-x86 target.
        def requestedAbis = (project.findProperty('mediaKitAndroidAbis')
                ?: System.getenv('MEDIA_KIT_ANDROID_ABIS')
                ?: 'arm64-v8a,armeabi-v7a,x86_64')
            .toString().split(',').collect { it.trim() }.findAll { it }
        println "media_kit_libs_android_video: downloading ABIs ${requestedAbis}"

        def allAbiJars = [
            ["abi": "arm64-v8a", "url": "https://github.com/media-kit/libmpv-android-video-build/releases/download/v1.1.11/full-arm64-v8a.jar", "md5": "86f2c8faeb66af1878b3a16f67831cb3", "destination": file("$buildDir/v1.1.11/full-arm64-v8a.jar")],
            ["abi": "armeabi-v7a", "url": "https://github.com/media-kit/libmpv-android-video-build/releases/download/v1.1.11/full-armeabi-v7a.jar", "md5": "93542d40e44f3afad3aa773674e8eaa5", "destination": file("$buildDir/v1.1.11/full-armeabi-v7a.jar")],
            ["abi": "x86_64", "url": "https://github.com/media-kit/libmpv-android-video-build/releases/download/v1.1.11/full-x86_64.jar", "md5": "44b7efdbaf3626d6b24afaf5d497a369", "destination": file("$buildDir/v1.1.11/full-x86_64.jar")]
        ]
        def filesToDownload = allAbiJars.findAll { requestedAbis.contains(it.abi) }
        if (filesToDownload.isEmpty()) {
            throw new GradleException("mediaKitAndroidAbis matched no jars: ${requestedAbis}")
        }

        filesToDownload.each { fileInfo ->
            def destFile = fileInfo.destination
            if (destFile.exists() && md5Of(destFile) != fileInfo.md5) {
                destFile.delete()
                println "MD5 mismatch. File deleted: ${destFile}"
            }

            if (!destFile.exists()) {
                destFile.parentFile.mkdirs()
                println "Downloading file from: ${fileInfo.url}"
                downloadVerified(fileInfo.url, destFile, fileInfo.md5)
            }

            copy {
                from destFile
                into outputDir
            }
        }
}

assemble.dependsOn(downloadDependencies)