# Copy-paste Weblate component config for JAVP UI strings.
# Docs: https://docs.weblate.org/en/latest/formats/arb.html
#
# Hosted: https://hosted.weblate.org/  (or your self-hosted Weblate).
# This file is not auto-loaded; paste / import it when creating the component.
# Releases vendor ARBs from git — they do not call Weblate at build time.
#
# Agents add English only (tool/l10n/add_en.py → app_en.arb).
# Translators / Weblate own lib/l10n/app_<locale>.arb.

[component]
name = JAVP
slug = javp
file_format = arb
filemask = lib/l10n/app_*.arb
template = lib/l10n/app_en.arb
new_base = lib/l10n/app_en.arb
monolingual = true
edit_template = true
allow_translation_propagation = true
add_message = true
# Weblate opens PRs; do not push straight to main/dev.
vcs = github
push_branch = weblate-javp
merge_style = rebase
commit_message = i18n: update {component_name} ({language_name})

