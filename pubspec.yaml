name: javp
description: Just Another Video Player — BYO media, IPTV, and tracking in one app.
publish_to: "none"
version: 0.6.0+96

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  video_player: ^2.14.0
  # Tizen / webOS platform implementations (no-op on Android builds).
  video_player_tizen: ^2.5.15
  shared_preferences_tizen: ^2.3.5
  path_provider_tizen: ^2.2.1
  flutter_secure_storage_tizen: ^0.1.5
  connectivity_plus_tizen: ^1.3.2
  package_info_plus_tizen: ^1.0.1
  url_launcher_tizen: ^2.1.7
  sqflite_tizen: ^0.1.5
  provider: ^6.1.5+1
  go_router: ^18.0.0
  shared_preferences: ^2.5.5
  shared_preferences_platform_interface: ^2.4.2
  http: ^1.6.0
  path_provider: ^2.1.6
  path_provider_platform_interface: ^2.1.0
  path_provider_windows: ^2.3.0
  shared_preferences_windows: ^2.4.1
  collection: ^1.19.1
  uuid: ^4.6.0
  intl: ^0.20.2
  xml: ^6.6.1
  google_fonts: ^8.2.1
  file_picker: ^10.3.2
  image: ^4.9.2
  flutter_secure_storage: ^10.3.1
  rqbit_engine:
    path: packages/rqbit_engine
  socks5_proxy: ^2.1.1
  url_launcher: ^6.3.1
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1
  sqflite: ^2.4.3
  path: ^1.9.1
  qr_flutter: ^4.1.0
  connectivity_plus: ^7.3.1
  package_info_plus: ^9.0.1
  open_filex: ^4.7.0
  crypto: ^3.0.7
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.0
  sqflite_common_ffi: ^2.4.2
  window_manager: ^0.5.2
  archive: ^4.0.9
  sqlite3_flutter_libs: ^0.5.39
  ffi: ^2.2.0
  dart_discord_presence: ^1.2.0
  share_plus: ^12.0.2
  cryptography: ^2.9.0
  tray_manager: ^0.5.3
  multicast_dns: ^0.3.2+7
  flutter_markdown_plus: ^1.0.12
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Windows Store / sideload MSIX packaging (see docs/microsoft-store.md).
  msix: ^3.16.12

# Widest Android codec coverage: media-kit "full" libmpv jars (all decoders/demuxers).
dependency_overrides:
  media_kit_libs_android_video:
    path: packages/media_kit_libs_android_video

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/branding/javp_logo.png
    - assets/branding/javp_tray.ico
    - assets/branding/javp_tray_dev.ico
    - assets/demo/catalog.json

# Microsoft Store / MSIX — Partner Center product 9P4PMM405RZH (Cubeweb).
# Build: flutter build windows --release --dart-define=JAVP_DISTRIBUTION=msstore
#        dart run msix:create --store
# Docs: docs/microsoft-store.md
msix_config:
  display_name: JAVP
  publisher_display_name: Cubeweb
  identity_name: Cubeweb.JAVP
  publisher: CN=C2181184-0E48-441B-94C4-B746E8C0BF5F
  msix_version: 0.6.0.0
  logo_path: assets/branding/javp_logo.png
  capabilities: internetClient
  languages: en-us
  store: true
